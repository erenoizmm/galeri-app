workflows:
  android-release:
    name: Neon Galeri Android Build
    max_build_duration: 60
    environment:
      flutter: 3.22.0
      android_signing:
        - keystore_reference
    scripts:
      - name: Proje oluştur ve APK al
        script: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - erenoizm@gmail.com
        notify:
          success: true
          failure: true
